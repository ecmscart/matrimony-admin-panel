<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Maher Marriage Bureau">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Outer decorative arch -->
  <path d="M44 220 V 110 Q 44 40 128 40 Q 212 40 212 110 V 220"
        fill="none" stroke="url(#gold)" stroke-width="6" stroke-opacity="0.55"/>

  <!-- Inner arch -->
  <path d="M70 220 V 118 Q 70 66 128 66 Q 186 66 186 118 V 220"
        fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.7"/>

  <!-- Heart formed by two intertwining curves -->
  <path d="M128 184
           C 92 158, 76 132, 90 110
           C 100 94, 120 96, 128 114
           C 136 96, 156 94, 166 110
           C 180 132, 164 158, 128 184 Z"
        fill="url(#goldSoft)"
        stroke="url(#gold)" stroke-width="3" stroke-linejoin="round"/>

  <!-- Two figures (heads) representing the couple -->
  <circle cx="108" cy="100" r="11" fill="#ffffff" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="148" cy="100" r="11" fill="#ffffff" stroke="url(#gold)" stroke-width="3"/>

  <!-- Infinity ribbon at the base -->
  <path d="M88 210
           C 88 198, 110 198, 118 208
           C 124 215, 132 215, 138 208
           C 146 198, 168 198, 168 210
           C 168 222, 146 222, 138 212
           C 132 205, 124 205, 118 212
           C 110 222, 88 222, 88 210 Z"
        fill="none" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>
</svg>
